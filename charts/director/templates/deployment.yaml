apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "director.fullname" . }}
  labels:
    {{- include "director.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "director.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "director.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: REDIS_HOST
              {{- if .Values.config.valkey.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.valkey.existingSecret }}
                  key: {{ .Values.config.valkey.existingSecretKeys.host }}
              {{- else }}
              value: {{ .Values.config.valkey.host | quote }}
              {{- end }}
            - name: REDIS_PORT
              {{- if .Values.config.valkey.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.valkey.existingSecret }}
                  key: {{ .Values.config.valkey.existingSecretKeys.port }}
              {{- else }}
              value: {{ .Values.config.valkey.port | quote }}
              {{- end }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.config.valkey.existingSecret }}
                  name: {{ .Values.config.valkey.existingSecret }}
                  key: {{ .Values.config.valkey.existingSecretKeys.password }}
                  {{- else }}
                  name: {{ include "director.fullname" . }}-config
                  key: redis-password
                  {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
